name: Host C++ CI (not PS4 verification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Linux / ${{ matrix.compiler }} / offline tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang g++ python3
      - name: Configure
        run: |
          if [ '${{ matrix.compiler }}' = clang ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Unit and ABI tests
        run: ctest --test-dir build --output-on-failure
      - name: CLI JSON smoke test
        run: bash scripts/smoke.sh
